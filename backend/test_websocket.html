<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test - DOS Attack Map</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #0a0e27;
            color: #fff;
        }
        h1 {
            color: #4ade80;
            border-bottom: 2px solid #4ade80;
            padding-bottom: 10px;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .panel {
            background: #1a1f3a;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #2a3f5f;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            font-weight: bold;
        }
        .status.connected {
            background: #10b981;
            color: white;
        }
        .status.disconnected {
            background: #ef4444;
            color: white;
        }
        .status.connecting {
            background: #f59e0b;
            color: white;
        }
        button {
            background: #4ade80;
            color: #0a0e27;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        button:hover {
            background: #22c55e;
        }
        button:disabled {
            background: #6b7280;
            cursor: not-allowed;
        }
        .messages {
            background: #0a0e27;
            border: 1px solid #2a3f5f;
            border-radius: 4px;
            padding: 10px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .message {
            padding: 8px;
            margin: 5px 0;
            border-left: 3px solid #4ade80;
            background: #1a1f3a;
        }
        .message.attack {
            border-left-color: #ef4444;
        }
        .message.stats {
            border-left-color: #3b82f6;
        }
        .attack-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin-top: 5px;
            font-size: 11px;
        }
        .label {
            color: #9ca3af;
        }
        .value {
            color: #4ade80;
            font-weight: bold;
        }
        .controls {
            margin-bottom: 20px;
        }
        .stats-display {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .stat-box {
            background: #0a0e27;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            color: #4ade80;
            font-weight: bold;
        }
        .stat-label {
            color: #9ca3af;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>🌍 DOS Attack Map - WebSocket Test</h1>
    
    <div class="container">
        <!-- Attacks WebSocket Panel -->
        <div class="panel">
            <h2>⚡ Real-Time Attacks</h2>
            <div class="status disconnected" id="attackStatus">Disconnected</div>
            
            <div class="controls">
                <button id="connectAttacks" onclick="connectAttacks()">Connect</button>
                <button id="disconnectAttacks" onclick="disconnectAttacks()" disabled>Disconnect</button>
                <button onclick="clearMessages('attackMessages')">Clear</button>
            </div>
            
            <div class="stats-display">
                <div class="stat-box">
                    <div class="stat-value" id="attackCount">0</div>
                    <div class="stat-label">Attacks Received</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="connectionTime">--</div>
                    <div class="stat-label">Connected</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="lastAttackTime">--</div>
                    <div class="stat-label">Last Attack</div>
                </div>
            </div>
            
            <h3>Messages:</h3>
            <div class="messages" id="attackMessages"></div>
        </div>
        
        <!-- Stats WebSocket Panel -->
        <div class="panel">
            <h2>📊 Statistics Stream</h2>
            <div class="status disconnected" id="statsStatus">Disconnected</div>
            
            <div class="controls">
                <button id="connectStats" onclick="connectStats()">Connect</button>
                <button id="disconnectStats" onclick="disconnectStats()" disabled>Disconnect</button>
                <button onclick="clearMessages('statsMessages')">Clear</button>
            </div>
            
            <div class="stats-display">
                <div class="stat-box">
                    <div class="stat-value" id="totalAttacks">0</div>
                    <div class="stat-label">Total Attacks</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="updateCount">0</div>
                    <div class="stat-label">Updates Received</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="statsConnectionTime">--</div>
                    <div class="stat-label">Connected</div>
                </div>
            </div>
            
            <h3>Messages:</h3>
            <div class="messages" id="statsMessages"></div>
        </div>
    </div>

    <script>
        let attacksWs = null;
        let statsWs = null;
        let attackCount = 0;
        let updateCount = 0;
        let attackConnectTime = null;
        let statsConnectTime = null;

        // Auto-connect on page load
        window.onload = () => {
            connectAttacks();
            connectStats();
        };

        function connectAttacks() {
            const status = document.getElementById('attackStatus');
            status.textContent = 'Connecting...';
            status.className = 'status connecting';
            
            attacksWs = new WebSocket('ws://localhost:8000/ws/attacks');
            
            attacksWs.onopen = () => {
                status.textContent = '✅ Connected';
                status.className = 'status connected';
                document.getElementById('connectAttacks').disabled = true;
                document.getElementById('disconnectAttacks').disabled = false;
                attackConnectTime = new Date();
                updateConnectionTime();
                addMessage('attackMessages', {
                    type: 'system',
                    message: 'Connected to attack stream'
                });
            };
            
            attacksWs.onmessage = (event) => {
                const data = JSON.parse(event.data);
                addMessage('attackMessages', data);
                
                if (data.type === 'attack') {
                    attackCount++;
                    document.getElementById('attackCount').textContent = attackCount;
                    document.getElementById('lastAttackTime').textContent = 
                        new Date().toLocaleTimeString();
                }
            };
            
            attacksWs.onerror = (error) => {
                console.error('Attacks WebSocket error:', error);
                addMessage('attackMessages', {
                    type: 'error',
                    message: 'WebSocket error occurred'
                });
            };
            
            attacksWs.onclose = () => {
                status.textContent = '❌ Disconnected';
                status.className = 'status disconnected';
                document.getElementById('connectAttacks').disabled = false;
                document.getElementById('disconnectAttacks').disabled = true;
                addMessage('attackMessages', {
                    type: 'system',
                    message: 'Disconnected from attack stream'
                });
            };
        }

        function disconnectAttacks() {
            if (attacksWs) {
                attacksWs.close();
                attacksWs = null;
            }
        }

        function connectStats() {
            const status = document.getElementById('statsStatus');
            status.textContent = 'Connecting...';
            status.className = 'status connecting';
            
            statsWs = new WebSocket('ws://localhost:8000/ws/stats');
            
            statsWs.onopen = () => {
                status.textContent = '✅ Connected';
                status.className = 'status connected';
                document.getElementById('connectStats').disabled = true;
                document.getElementById('disconnectStats').disabled = false;
                statsConnectTime = new Date();
                updateStatsConnectionTime();
                addMessage('statsMessages', {
                    type: 'system',
                    message: 'Connected to stats stream'
                });
            };
            
            statsWs.onmessage = (event) => {
                const data = JSON.parse(event.data);
                addMessage('statsMessages', data);
                
                if (data.type === 'stats') {
                    updateCount++;
                    document.getElementById('updateCount').textContent = updateCount;
                    document.getElementById('totalAttacks').textContent = 
                        data.data.total_attacks || 0;
                }
            };
            
            statsWs.onerror = (error) => {
                console.error('Stats WebSocket error:', error);
                addMessage('statsMessages', {
                    type: 'error',
                    message: 'WebSocket error occurred'
                });
            };
            
            statsWs.onclose = () => {
                status.textContent = '❌ Disconnected';
                status.className = 'status disconnected';
                document.getElementById('connectStats').disabled = false;
                document.getElementById('disconnectStats').disabled = true;
                addMessage('statsMessages', {
                    type: 'system',
                    message: 'Disconnected from stats stream'
                });
            };
        }

        function disconnectStats() {
            if (statsWs) {
                statsWs.close();
                statsWs = null;
            }
        }

        function addMessage(containerId, data) {
            const container = document.getElementById(containerId);
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${data.type || ''}`;
            
            const timestamp = new Date().toLocaleTimeString();
            
            if (data.type === 'attack') {
                const attack = data.data;
                messageDiv.innerHTML = `
                    <strong>[${timestamp}] 🚨 Attack Detected</strong>
                    <div class="attack-info">
                        <div><span class="label">IP:</span> <span class="value">${attack.ip_address}</span></div>
                        <div><span class="label">Country:</span> <span class="value">${attack.country_name}</span></div>
                        <div><span class="label">Type:</span> <span class="value">${attack.classification}</span></div>
                        <div><span class="label">Threat:</span> <span class="value">${attack.threat_score}</span></div>
                    </div>
                `;
            } else if (data.type === 'stats') {
                messageDiv.innerHTML = `
                    <strong>[${timestamp}] 📊 Stats Update</strong>
                    <div>Total Attacks: ${data.data.total_attacks}</div>
                `;
            } else {
                messageDiv.innerHTML = `<strong>[${timestamp}]</strong> ${data.message || JSON.stringify(data)}`;
            }
            
            container.insertBefore(messageDiv, container.firstChild);
            
            // Keep only last 50 messages
            while (container.children.length > 50) {
                container.removeChild(container.lastChild);
            }
        }

        function clearMessages(containerId) {
            document.getElementById(containerId).innerHTML = '';
            if (containerId === 'attackMessages') {
                attackCount = 0;
                document.getElementById('attackCount').textContent = '0';
            } else {
                updateCount = 0;
                document.getElementById('updateCount').textContent = '0';
            }
        }

        function updateConnectionTime() {
            if (attackConnectTime) {
                const seconds = Math.floor((new Date() - attackConnectTime) / 1000);
                document.getElementById('connectionTime').textContent = `${seconds}s`;
            }
            setTimeout(updateConnectionTime, 1000);
        }

        function updateStatsConnectionTime() {
            if (statsConnectTime) {
                const seconds = Math.floor((new Date() - statsConnectTime) / 1000);
                document.getElementById('statsConnectionTime').textContent = `${seconds}s`;
            }
            setTimeout(updateStatsConnectionTime, 1000);
        }
    </script>
</body>
</html>
